version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      azure:
        patterns: ["Azure.*", "Microsoft.Identity.*"]
      dotnet:
        patterns: ["Microsoft.*", "System.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ["/src/StoreOps.Web", "/src/StoreOps.Jobs"]
    schedule:
      interval: weekly
