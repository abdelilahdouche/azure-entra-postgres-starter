name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

  bicep:
    name: Bicep build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: az bicep install

      - name: Build and lint templates
        run: |
          for template in infra/main.bicep infra/shared.bicep; do
            az bicep build --file "$template" --stdout > /dev/null
            az bicep lint --file "$template"
          done

      - name: Build parameter files
        env:
          IMAGE_TAG: ci
          REGISTRY_NAME: crci
          ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          DEPLOYER_OBJECT_ID: 00000000-0000-0000-0000-000000000000
          DEPLOYER_NAME: ci
        run: |
          for params in infra/parameters/*.bicepparam; do
            az bicep build-params --file "$params" --stdout > /dev/null
            echo "✔ $params"
          done

  what-if:
    name: What-if (dev)
    # Only for PRs from this repository, once Azure is configured.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AZURE_CLIENT_ID != ''
    needs: [build-test, bicep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC login, no secret
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preview infrastructure changes
        env:
          IMAGE_TAG: ${{ github.event.pull_request.head.sha }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID_DEV }}
          DEPLOYER_OBJECT_ID: ${{ vars.DEPLOYER_OBJECT_ID }}
          DEPLOYER_NAME: ${{ vars.DEPLOYER_NAME }}
          DBA_GROUP_OBJECT_ID: ${{ vars.DBA_GROUP_OBJECT_ID }}
          DBA_GROUP_NAME: ${{ vars.DBA_GROUP_NAME }}
        run: |
          REGISTRY_NAME="$(az deployment sub show --name storeops-shared --query properties.outputs.registryName.value -o tsv 2>/dev/null || echo crplaceholder)"
          export REGISTRY_NAME
          {
            echo '### What-if: dev'
            echo '```'
            az deployment sub what-if \
              --location "${{ vars.AZURE_LOCATION || 'canadacentral' }}" \
              --template-file infra/main.bicep \
              --parameters infra/parameters/dev.bicepparam 2>&1 | sed -r 's/\x1B\[[0-9;]*m//g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
